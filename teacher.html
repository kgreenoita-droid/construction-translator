<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>講師用 - 多言語通訳システム（Aqua Voice版）</title>
<style>
  :root {
    --bg: #000; --bg2: #0d0d0d; --bg3: #111;
    --border: #222; --text: #eee; --text2: #666;
    --accent: #f0a500; --success: #3fb950; --danger: #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: 'Noto Sans JP','Noto Sans',sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; overflow: hidden; }

  header { background: #080808; border-bottom: 2px solid var(--accent); padding: 8px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  header h1 { font-size: 14px; font-weight: 700; color: var(--accent); }
  .hint { margin-left: auto; font-size: 11px; color: var(--text2); }
  .settings-toggle-btn { background: #1a1a1a; border: 1px solid #333; color: #888; border-radius: 6px; padding: 4px 8px; font-size: 14px; cursor: pointer; margin-left: 8px; }
  .settings-toggle-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* 設定パネル */
  #settingsPanel { display: none; background: #060606; border-bottom: 1px solid var(--border); max-height: 55vh; overflow-y: auto; }
  .bar { padding: 8px 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid #161616; }
  .bar-label { font-size: 11px; color: var(--text2); white-space: nowrap; }
  .api-input { background: #111; border: 1px solid #333; color: var(--text); border-radius: 6px; padding: 5px 10px; font-size: 12px; font-family: monospace; width: 200px; }
  .api-input::placeholder { color: #444; }
  .btn-mini { background: #1a1a1a; border: 1px solid #333; color: #888; border-radius: 6px; padding: 5px 10px; font-size: 11px; cursor: pointer; font-family: inherit; }
  .btn-mini:hover { border-color: var(--accent); color: var(--accent); }

  .lang-chip { display: flex; align-items: center; gap: 4px; background: #111; border: 1px solid #333; border-radius: 16px; padding: 3px 8px; cursor: pointer; user-select: none; font-size: 12px; color: #666; white-space: nowrap; }
  .lang-chip.selected { border-color: var(--accent); color: var(--accent); background: rgba(240,165,0,0.08); }
  .lang-chip input { display: none; }

  .cat-btn { background: var(--bg3); border: 1px solid var(--border); color: var(--text2); border-radius: 16px; padding: 4px 12px; font-size: 12px; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .cat-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }

  .cat-group-label { font-size: 10px; color: var(--accent); font-weight: 700; margin-right: 2px; align-self: center; white-space: nowrap; }
  .cat-group-sep { width: 100%; height: 0; flex-basis: 100%; }
  .engine-btn { background: var(--bg3); border: 1px solid var(--border); color: var(--text2); border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .engine-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }

  /* 辞書・用語集 */
  .sub-tabs { display: flex; gap: 6px; padding: 8px 14px 0; }
  .sub-tab { background: none; border: none; border-bottom: 2px solid transparent; color: var(--text2); padding: 6px 12px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .sub-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .sub-content { display: none; padding: 8px 14px; }
  .sub-content.active { display: block; }
  .dict-add-row { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .dict-input { flex: 1; min-width: 120px; background: #111; border: 1px solid #333; color: var(--text); border-radius: 6px; padding: 6px 10px; font-size: 13px; font-family: inherit; }
  .dict-list { max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .dict-item { display: flex; align-items: center; gap: 8px; background: #111; border: 1px solid #333; border-radius: 6px; padding: 4px 10px; font-size: 13px; }
  .dict-wrong { color: var(--danger); flex: 1; }
  .dict-correct { color: var(--success); flex: 1; }
  .dict-del { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 14px; }
  .ctx-textarea { width: 100%; height: 90px; background: #111; border: 1px solid #333; color: var(--text); border-radius: 6px; padding: 8px; font-size: 12px; font-family: inherit; resize: vertical; }

  /* メイン */
  .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 10px; gap: 8px; min-height: 0; }
  .toprow { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .cat-current { font-size: 12px; color: var(--accent); font-weight: 700; }
  .status-chip { font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: auto; }
  .status-chip.ready { background: #1a3a1a; color: var(--success); }
  .status-chip.translating { background: #3a2f1a; color: var(--accent); }

  #jaInput { width: 100%; min-height: 64px; background: #0a0a1a; border: 2px solid #2a2a4a; color: #fff; border-radius: 10px; padding: 12px 16px; font-size: 22px; font-weight: 700; font-family: inherit; line-height: 1.4; resize: none; flex-shrink: 0; }
  #jaInput:focus { outline: none; border-color: var(--accent); }
  #jaInput::placeholder { color: #333; font-weight: 400; font-size: 15px; }
  .manual-row { display: flex; gap: 8px; flex-shrink: 0; }
  .btn { background: var(--accent); border: none; color: #000; border-radius: 6px; padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn-sub { background: var(--bg3); border: 1px solid var(--border); color: var(--text2); border-radius: 6px; padding: 8px 12px; font-size: 13px; cursor: pointer; font-family: inherit; }

  .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 4px 10px 0; min-height: 0; }
  .history-list::-webkit-scrollbar { width: 6px; }
  .history-list::-webkit-scrollbar-track { background: #0a0a0a; }
  .history-list::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
  .hist-item { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; flex-shrink: 0; }
  .hist-item.latest { border-color: var(--accent); background: #0d0d0d; }
  .hist-ja { font-size: 15px; font-weight: 700; color: #bbb; margin-bottom: 8px; line-height: 1.4; }
  .hist-lang-row { display: flex; align-items: baseline; gap: 8px; margin-top: 5px; }
  .hist-flag { font-size: 16px; flex-shrink: 0; }
  .hist-name { font-size: 11px; color: #444; width: 90px; flex-shrink: 0; }
  .hist-text { font-size: 22px; color: #fff; line-height: 1.45; }
  .hist-text.loading { color: #444; font-size: 14px; font-style: italic; }
  .hist-head { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
  .hist-head .hist-ja { margin-bottom: 0; flex: 1; cursor: pointer; }
  .hist-head .hist-ja:hover { color: var(--accent); }
  .hist-btns { display: flex; gap: 4px; flex-shrink: 0; }
  .hist-edit { background: #1a1a1a; border: 1px solid #333; color: #888; border-radius: 5px; padding: 3px 8px; font-size: 11px; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .hist-edit:hover { border-color: var(--accent); color: var(--accent); }
  .edit-input { width: 70%; background: #111; border: 1px solid var(--accent); color: #fff; border-radius: 6px; padding: 6px 10px; font-size: 15px; font-family: inherit; }
  /* 文字サイズ段階（履歴の翻訳文字） */
  body[data-size="s"] .hist-text { font-size: 18px; }
  body[data-size="m"] .hist-text { font-size: 22px; }
  body[data-size="l"] .hist-text { font-size: 28px; }
  body[data-size="xl"] .hist-text { font-size: 36px; }
  body[data-size="s"] .hist-ja { font-size: 13px; }
  body[data-size="m"] .hist-ja { font-size: 15px; }
  body[data-size="l"] .hist-ja { font-size: 18px; }
  body[data-size="xl"] .hist-ja { font-size: 22px; }
  .empty-msg { color: var(--text2); font-size: 14px; text-align: center; padding: 30px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<header>
  <h1>🎙 多言語通訳システム（講師用）</h1>
  <span class="hint">入力欄にAqua Voiceで音声入力 → 話し終わると自動翻訳</span>
  <button class="settings-toggle-btn" onclick="toggleSettings()" title="設定">⚙️ 設定</button>
</header>

<div id="settingsPanel">
  <!-- APIキー・合言葉 -->
  <div class="bar">
    <span class="bar-label" id="keyStatus" style="color:#444">APIキー確認中...</span>
    <input type="password" class="api-input" id="apiKeyInput" placeholder="手動入力（任意）" style="display:none" />
    <button class="btn-mini" id="apiKeySaveBtn" onclick="saveApiKey()" style="display:none">保存</button>
  </div>

  <!-- 翻訳モデル -->
  <div class="bar">
    <span class="bar-label">翻訳モデル：</span>
    <button class="engine-btn" id="modelSonnet" onclick="switchModel('sonnet')">✨ Sonnet（高品質）</button>
    <button class="engine-btn active" id="modelHaiku" onclick="switchModel('haiku')">⚡ Haiku（高速）</button>
  </div>

  <!-- 品質チェック（逆翻訳） -->
  <div class="bar" style="flex-direction:column;align-items:stretch;gap:6px;">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <span class="bar-label">🔍 品質チェック（逆翻訳）：</span>
      <input class="dict-input" id="qcInput" placeholder="日本語を入力（例：荷を上げる運動を巻き上げという）" style="flex:1;min-width:180px;" />
      <button class="btn-mini" onclick="runQualityCheck()">両モデルで試す</button>
    </div>
    <div id="qcResult" style="font-size:12px;color:var(--text2);"></div>
  </div>

  <!-- 自動翻訳の待ち時間 -->
  <div class="bar">
    <span class="bar-label">自動翻訳の待ち時間：</span>
    <input type="range" id="delaySlider" min="0.1" max="2.5" step="0.1" value="0.1" style="width:160px;accent-color:var(--accent);cursor:pointer;" oninput="updateDelay(this.value)">
    <span class="bar-label" id="delayLabel" style="color:var(--text)">0.1秒</span>
  </div>

  <!-- 文字サイズ -->
  <div class="bar">
    <span class="bar-label">文字サイズ：</span>
    <button class="engine-btn" onclick="setSize('s')" id="size-s">小</button>
    <button class="engine-btn" onclick="setSize('m')" id="size-m">中</button>
    <button class="engine-btn" onclick="setSize('l')" id="size-l">大</button>
    <button class="engine-btn" onclick="setSize('xl')" id="size-xl">特大</button>
  </div>

  <!-- 表示言語 -->
  <div class="bar" style="flex-direction:column;align-items:stretch;gap:6px;">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <span class="bar-label">表示言語（最大3つ）：</span>
      <div id="langChips" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
      <span class="bar-label">言語の追加：</span>
      <input class="dict-input" id="newLangName" placeholder="言語名（例：タイ語）" style="max-width:120px;" />
      <input class="dict-input" id="newLangNative" placeholder="現地表記（例：ภาษาไทย）" style="max-width:130px;" />
      <input class="dict-input" id="newLangFlag" placeholder="旗🇹🇭" style="max-width:70px;" />
      <button class="btn-mini" onclick="addLanguage()">＋追加</button>
      <span class="bar-label" id="langMsg" style="color:var(--success)"></span>
    </div>
  </div>

  <!-- 辞書・用語集 -->
  <div class="sub-tabs">
    <button class="sub-tab active" onclick="switchSub('dict')">📖 辞書</button>
    <button class="sub-tab" onclick="switchSub('ctx')">📄 用語集</button>
    <button class="sub-tab" onclick="switchSub('taiyaku')">🌐 対訳表</button>
  </div>
  <div class="sub-content active" id="sub-dict">
    <div class="dict-add-row">
      <input class="dict-input" id="dictWrong" placeholder="誤（例：関電）" />
      <span style="color:var(--text2);align-self:center">→</span>
      <input class="dict-input" id="dictCorrect" placeholder="正（例：感電）" />
      <button class="btn-mini" onclick="addDict()">追加</button>
    </div>
    <div class="dict-list" id="dictList"></div>
  </div>
  <div class="sub-content" id="sub-ctx">
    <textarea class="ctx-textarea" id="ctxTextarea" placeholder="講習テキストや用語集を貼り付け..."></textarea>
    <div style="display:flex;gap:8px;margin-top:6px;align-items:center;">
      <label class="btn-mini">📂 ファイル読込<input type="file" accept=".txt" style="display:none" onchange="loadTxtFile(event)"></label>
      <button class="btn-mini" onclick="saveCtx()">✓ 保存</button>
      <span class="bar-label" id="ctxStatus" style="color:var(--success)"></span>
    </div>
  </div>
  <div class="sub-content" id="sub-taiyaku">
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;">
      <span class="bar-label" id="taiyakuCount" style="color:var(--text)"></span>
      <button class="btn-mini" onclick="addTaiyakuTerm()">＋用語を追加</button>
      <button class="btn-mini" onclick="aiFillTaiyaku()">🤖 AIで未訳を一括翻訳</button>
      <button class="btn-mini" onclick="exportTaiyakuExcel()">📊 確認用エクセル出力</button>
      <span class="bar-label" id="taiyakuMsg" style="color:var(--success)"></span>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:8px;">
      <input class="dict-input" id="newTaiyakuJa" placeholder="日本語の用語（例：玉掛け）" style="max-width:160px;" />
      <input class="dict-input" id="newTaiyakuFuri" placeholder="フリガナ" style="max-width:120px;" />
    </div>
    <div id="taiyakuList" style="max-height:220px;overflow:auto;font-size:11px;"></div>
  </div>

  <!-- データ管理 -->
  <div class="bar" style="flex-direction:column;align-items:stretch;gap:8px;border-top:1px solid #222;">
    <span class="bar-label" style="color:var(--accent);font-weight:700;">📁 データ管理</span>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
      <span class="bar-label">文字起こし：</span>
      <button class="btn-mini" onclick="downloadTranscript()">⬇ 今日の文字起こしを保存</button>
      <span class="bar-label" style="color:#555;">（選択中の講習・本日分）</span>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
      <span class="bar-label">辞書・用語集：</span>
      <button class="btn-mini" onclick="downloadSettings()">⬇ バックアップ保存</button>
      <label class="btn-mini">⬆ 読み込み（復元・統合）<input type="file" accept=".json" style="display:none" onchange="uploadSettings(event)"></label>
      <span class="bar-label" id="dataMsg" style="color:var(--success)"></span>
    </div>
  </div>
</div>

<div class="content">
  <div class="toprow">
    <span class="bar-label">講習種別：</span>
    <div id="catRow" style="display:flex;gap:6px;flex-wrap:wrap;flex:1;"></div>
    <span class="status-chip ready" id="statusChip">待機中</span>
  </div>

  <textarea id="jaInput" placeholder="ここにカーソルを置いてAqua Voiceで話してください。話し終わると自動で翻訳します。" autofocus></textarea>

  <div class="history-list" id="historyList">
    <div class="empty-msg">音声入力して話し終わると、ここに翻訳が表示されます</div>
  </div>
</div>

<script>
const DEFAULT_LANGUAGES = [
  { code:'zh', name:'中国語', native:'中文', flag:'🇨🇳' },
  { code:'en', name:'英語', native:'English', flag:'🇺🇸' },
  { code:'vi', name:'ベトナム語', native:'Tiếng Việt', flag:'🇻🇳' },
  { code:'tl', name:'タガログ語', native:'Filipino', flag:'🇵🇭' },
  { code:'id', name:'インドネシア語', native:'Bahasa', flag:'🇮🇩' },
  { code:'my', name:'ミャンマー語', native:'မြန်မာ', flag:'🇲🇲' },
  { code:'ne', name:'ネパール語', native:'नेपाली', flag:'🇳🇵' },
  { code:'si', name:'シンハラ語', native:'සිංහල', flag:'🇱🇰' },
  { code:'bn', name:'ベンガル語', native:'বাংলা', flag:'🇧🇩' },
  { code:'km', name:'クメール語', native:'ខ្មែរ', flag:'🇰🇭' },
];
let LANGUAGES = JSON.parse(localStorage.getItem('teacher_langlist') || 'null') || DEFAULT_LANGUAGES.slice();

const CATEGORIES = [
  // 建設系（技能講習＋特別教育）
  {id:'tamakake', group:'建設系', label:'⛓️ 玉掛け/クレーン', subs:['玉掛け','小型移動式クレーン運転','つり上げ荷重5トン未満クレーン']},
  {id:'gas', group:'建設系', label:'🔥 ガス溶接', subs:['ガス溶接','アーク溶接等']},
  {id:'kouso', group:'建設系', label:'🪜 高所作業車', subs:['高所作業車運転','高所作業車（10m未満）']},
  {id:'vehicle', group:'建設系', label:'🚜 車両系', subs:['車両系建設機械（整地等）','小型車両系建設機械','締固め用機械（ローラー）']},
  {id:'forklift', group:'建設系', label:'🏭 フォークリフト', subs:['フォークリフト運転']},
  {id:'ashiba', group:'建設系', label:'🦺 足場/フルハーネス', subs:['足場の組立て','フルハーネス（墜落制止用器具）']},
  {id:'other_const', group:'建設系', label:'🔧 その他建設', subs:['自由研削砥石','その他建設']},
  // その他系
  {id:'legal', group:'その他', label:'⚖️ 法的保護', subs:['法的保護講習']},
  {id:'police_fire', group:'その他', label:'🚔 警察/消防', subs:['警察講習','消防講習']},
  {id:'life', group:'その他', label:'🏠 生活説明', subs:['生活説明']},
];

const CATEGORY_CONTEXT = {
  tamakake:'玉掛け・小型移動式クレーン・つり上げ5トン未満クレーン（ワイヤーロープ、スリング、シャックル、フック、荷重計算、つり角度、安全荷重、定格荷重、作業半径、ブーム長、アウトリガー、過負荷防止、巻過防止）',
  gas:'ガス溶接・アーク溶接等（アセチレン、酸素、溶接棒、吹管、圧力調整器、逆火、溶接電流、電圧、アーク長、スパッタ、被覆アーク溶接、炭酸ガスアーク溶接）',
  kouso:'高所作業車（作業床、最大積載荷重、ブーム、アウトリガー、安全帯、墜落制止、過負荷防止装置、10m未満）',
  vehicle:'車両系建設機械・整地等・小型・締固めローラー（ショベル、ブルドーザー、転倒防止、掘削、整地、運搬、積込み、地耐力、作業計画、ローラー）',
  forklift:'フォークリフト（フォーク、マスト、チルト、荷役、荷重中心、最大荷重、ヘッドガード、バックレスト）',
  ashiba:'足場・フルハーネス（単管足場、枠組足場、手すり、幅木、足場板、壁つなぎ、筋交、ランヤード、フック、D環、落下距離、ショックアブソーバー、作業前点検）',
  other_const:'自由研削砥石・その他建設作業（研削盤、砥石、カバー、試運転、保護具、安全作業）',
  legal:'法的保護講習・法令関連（労働安全衛生法、労働基準法、コンプライアンス、ハラスメント防止、個人情報保護、就業規則、権利義務）',
  police_fire:'警察講習・消防講習（不審者対応、緊急連絡、事故報告、交通安全、防犯対策、火災予防、消火器使用、避難誘導、防火管理、救急処置）',
  life:'生活説明（日本での生活ルール、ごみ分別、公共交通、医療、銀行、買い物、近隣マナー、緊急時対応）',
};

const MODEL_IDS = { sonnet: 'claude-sonnet-4-6', haiku: 'claude-haiku-4-5-20251001' };

let passphrase = localStorage.getItem('app_passphrase') || '';
let apiKey = localStorage.getItem('teacher_api_key') || '';
let useServerKey = false;
let serverConfig = { anthropic:false, passphrase_required:false };

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const port = location.port ? ':' + location.port : '';
  ws = new WebSocket(`${proto}//${location.hostname}${port}/ws`);
  ws.onopen = () => { console.log('受講者配信WS接続'); };
  ws.onclose = () => { setTimeout(connectWS, 3000); };
  ws.onerror = () => {};
}

// サーバー設定確認＋データ読み込み
async function loadServer() {
  // config
  try {
    const res = await fetch(apiUrl(`/config?passphrase=${encodeURIComponent(passphrase)}`));
    if (res.ok) {
      const cfg = await res.json();
      serverConfig = cfg;
      if (cfg.anthropic) useServerKey = true;
    }
  } catch(e) {}
  updateKeyStatus();
  // settings（辞書・用語集・言語リスト）
  try {
    const res = await fetch(apiUrl('/settings'));
    if (res.ok) {
      const d = await res.json();
      catDict = d.catDict || {};
      catContext = d.catContext || {};
      catTaiyaku = d.catTaiyaku || {};
      // 対訳表が空なら初期データ（玉掛け）を入れる
      if (!catTaiyaku.tamakake && INIT_TAIYAKU.tamakake) catTaiyaku.tamakake = INIT_TAIYAKU.tamakake;
      if (d.langList && d.langList.length) { LANGUAGES = d.langList; localStorage.setItem('teacher_langlist', JSON.stringify(LANGUAGES)); }
      // 旧形式（単一dict/context）を共通カテゴリに移行
      // 旧形式(dict/context)は使わない（新構成に移行済み）
      renderDict(); renderCtx(); renderLangChips();
    }
  } catch(e) {}
}
async function saveServer() {
  try {
    await fetch(apiUrl('/settings'), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ catDict, catContext, catTaiyaku, langList: LANGUAGES })
    });
  } catch(e) { console.log('保存エラー:', e); }
}

// 言語チップ
function renderLangChips() {
  const cont = document.getElementById('langChips');
  cont.innerHTML = LANGUAGES.map(l => {
    const sel = selectedLangs.has(l.code);
    return `<span class="lang-chip ${sel?'selected':''}"><label style="cursor:pointer;display:flex;align-items:center;gap:4px;"><input type="checkbox" value="${l.code}" ${sel?'checked':''}>${l.flag} ${l.name}</label><span onclick="removeLanguage('${l.code}')" style="cursor:pointer;color:#a44;margin-left:2px;" title="この言語を一覧から削除">✕</span></span>`;
  }).join('');
  cont.querySelectorAll('input').forEach(cb => cb.addEventListener('change', ()=>toggleLang(cb.value, cb.checked)));
}

// 言語を一覧に追加
function addLanguage() {
  const name = document.getElementById('newLangName').value.trim();
  const native = document.getElementById('newLangNative').value.trim();
  const flag = document.getElementById('newLangFlag').value.trim() || '🌐';
  if (!name) { alert('言語名を入力してください'); return; }
  // codeは名前から簡易生成（重複回避）
  let code = 'x' + Date.now().toString(36).slice(-4);
  LANGUAGES.push({ code, name, native: native||name, flag });
  localStorage.setItem('teacher_langlist', JSON.stringify(LANGUAGES));
  document.getElementById('newLangName').value='';
  document.getElementById('newLangNative').value='';
  document.getElementById('newLangFlag').value='';
  const msg = document.getElementById('langMsg'); msg.textContent = `✓「${name}」を追加`; setTimeout(()=>{msg.textContent='';},2500);
  renderLangChips();
  saveServer();
}

// 言語を一覧から削除
function removeLanguage(code) {
  const l = LANGUAGES.find(x=>x.code===code);
  if (!l) return;
  if (!confirm(`「${l.name}」を言語一覧から削除しますか？`)) return;
  LANGUAGES = LANGUAGES.filter(x=>x.code!==code);
  selectedLangs.delete(code);
  localStorage.setItem('teacher_langlist', JSON.stringify(LANGUAGES));
  localStorage.setItem('teacher_langs', JSON.stringify([...selectedLangs]));
  renderLangChips();
  saveServer();
}
function toggleLang(code, checked) {
  if (checked) {
    if (selectedLangs.size >= 3) { const first=[...selectedLangs][0]; selectedLangs.delete(first); }
    selectedLangs.add(code);
  } else selectedLangs.delete(code);
  localStorage.setItem('teacher_langs', JSON.stringify([...selectedLangs]));
  renderLangChips();
}

// 辞書
function currentDict() { return catDict[selectedCategory] || (catDict[selectedCategory] = []); }
function addDict() {
  const w = document.getElementById('dictWrong').value.trim();
  const c = document.getElementById('dictCorrect').value.trim();
  if (!w || !c) return;
  currentDict().push({ wrong:w, correct:c });
  document.getElementById('dictWrong').value=''; document.getElementById('dictCorrect').value='';
  renderDict(); saveServer();
}
function delDict(i) { currentDict().splice(i,1); renderDict(); saveServer(); }
function renderDict() {
  const list = document.getElementById('dictList');
  const d = currentDict();
  if (!d.length) { list.innerHTML = '<div style="color:var(--text2);font-size:12px;padding:6px;">この講習の辞書は空です</div>'; return; }
  list.innerHTML = d.map((e,i) =>
    `<div class="dict-item"><span class="dict-wrong">${esc(e.wrong)}</span><span style="color:var(--text2)">→</span><span class="dict-correct">${esc(e.correct)}</span><button class="dict-del" onclick="delDict(${i})">✕</button></div>`
  ).join('');
}
function applyDict(text) {
  let r = text;
  (catDict[selectedCategory]||[]).forEach(e => { r = r.split(e.wrong).join(e.correct); });
  return r;
}

// 自動翻訳スケジュール
function scheduleAutoTranslate() {
  if (idleTimer) clearTimeout(idleTimer);
  const el = document.getElementById('jaInput');
  if (!el.value.trim()) return;
  idleTimer = setTimeout(() => {
    if (document.getElementById('jaInput').value.trim() && !isTranslating) doTranslate();
  }, autoDelay * 1000);
}
document.getElementById('jaInput').addEventListener('input', scheduleAutoTranslate);

// 翻訳実行
async function doTranslate() {
  const inputEl = document.getElementById('jaInput');
  const raw = inputEl.value.trim();
  if (!raw || isTranslating) return;
  const langs = LANGUAGES.filter(l => selectedLangs.has(l.code));
  if (!langs.length) { alert('言語を1つ以上選んでください'); return; }
  if (!apiKey && !useServerKey) { alert('APIキーが設定されていません（⚙️設定）'); return; }

  const text = applyDict(raw); // 辞書補正

  isTranslating = true;
  if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
  setStatus('translating', '翻訳中...');
  inputEl.value = ''; inputEl.focus();

  const entry = { id: Date.now().toString(), ja: text, translations:{}, loading:true };
  history.unshift(entry);
  if (history.length > MAX_HISTORY) history.pop();
  renderHistory();
  sendJa('add', entry.id, text); // 受講者ページへ日本語を配信（並列翻訳）
  logTranscript(text); // 文字起こしを蓄積

  const ctxText = (catContext[selectedCategory] || '').slice(0, 2000);
  const ctxHint = CATEGORY_CONTEXT[selectedCategory] || '';
  const catName = CATEGORIES.find(c=>c.id===selectedCategory)?.label || '';
  const langList = langs.map(l => `- ${l.name}（${l.native}）: キー "${l.code}"`).join('\n');
  const ctxNote = ctxText ? `\n\n【参考用語集】\n${ctxText}` : '';
  const prompt = `建設業技能講習の専門翻訳者として翻訳してください。
講習: ${catName} / 用語分野: ${ctxHint}${ctxNote}

日本語:「${text}」

以下の言語へ翻訳してJSONのみ返してください:
${langList}

{"zh":"...","en":"..."}のように選択言語のキーのみ含めてください。説明文は不要です。`;

  try {
    const res = await fetch(apiUrl('/api'), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        api_key: (useServerKey ? '' : apiKey),
        passphrase: passphrase,
        model: MODEL_IDS[model],
        max_tokens: 900,
        stream: true,
        messages: [{ role:'user', content: prompt }]
      })
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf='', full='';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream:true});
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const d = line.slice(6).trim();
        if (d === '[DONE]') continue;
        try {
          const p = JSON.parse(d);
          if (p.type === 'content_block_delta' && p.delta?.text) {
            full += p.delta.text;
            const m = full.match(/\{[\s\S]*\}/);
            if (m) { try { entry.translations = JSON.parse(m[0]); entry.loading=false; renderHistory(); } catch(e){} }
          }
        } catch(e){}
      }
    }
    const m = full.match(/\{[\s\S]*\}/);
    if (m) { try { entry.translations = JSON.parse(m[0]); } catch(e){} }
    entry.loading = false; renderHistory();
  } catch(err) {
    entry.loading = false; entry.error = true; renderHistory();
    console.error('翻訳エラー:', err);
  } finally {
    isTranslating = false; setStatus('ready', '待機中');
  }
}

function renderHistory() {

  if (!history.length) { list.innerHTML = '<div class="empty-msg">音声入力して話し終わると、ここに翻訳が表示されます</div>'; return; }

// 修正を確定 → 辞書に自動蓄積 → 再翻訳
async function confirmEdit(id) {
  const item = history.find(h => h.id === id);
  if (!item) return;
  const inp = document.getElementById('edit-' + id);
  if (!inp) return;
  const newJa = inp.value.trim();
  if (!newJa) return;
  const oldJa = item.ja;

  // 辞書自動蓄積：元テキストと違う部分を誤→正として記録
  if (newJa !== oldJa) {
    autoLearnDict(oldJa, newJa); // バックグラウンドでAIが単語抽出（awaitしない＝翻訳を待たせない）
  }

  // 再翻訳
  item.ja = newJa;
  item.translations = {};
  item.loading = true;
  renderHistory();
  sendJa('edit', item.id, applyDict(newJa)); // 受講者ページへ修正後の日本語を配信
  await retranslate(item);
}

// 辞書自動蓄積：AIに修正前後を比較させ、変わった単語だけを誤→正で登録
async function autoLearnDict(oldJa, newJa) {
  if (!apiKey && !useServerKey) return;
  const prompt = `音声認識の誤りを修正しました。修正前と修正後を比較し、実際に変わった「単語」だけを抜き出してください。助詞や語尾など変わっていない部分は含めないでください。

修正前:「${oldJa}」
修正後:「${newJa}」

変わった単語のペアをJSON配列で返してください。形式:
[{"wrong":"誤った単語","correct":"正しい単語"}]

変化がない、または単語単位で抜き出せない場合は空配列 [] を返してください。JSONのみ出力し、説明は不要です。`;

  try {
    const res = await fetch(apiUrl('/api'), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        api_key: (useServerKey ? '' : apiKey),
        passphrase: passphrase,
        model: MODEL_IDS.haiku,
        max_tokens: 300,
        messages: [{ role:'user', content: prompt }]
      })
    });
    const data = await res.json();
    let out = '';
    if (data.content && data.content.length) out = data.content.map(b=>b.text||'').join('');
    const m = out.match(/\[[\s\S]*\]/);
    if (!m) return;
    const pairs = JSON.parse(m[0]);
    if (!Array.isArray(pairs) || !pairs.length) return;
    const d = currentDict();
    let added = 0;
    pairs.forEach(p => {
      if (!p.wrong || !p.correct || p.wrong === p.correct) return;
      const ex = d.find(e => e.wrong === p.wrong);
      if (ex) ex.correct = p.correct;
      else { d.push({ wrong: p.wrong, correct: p.correct }); added++; }
    });
    if (added > 0 || pairs.length) { renderDict(); saveServer(); }
  } catch(e) {
    console.log('辞書学習エラー:', e);
  }
}

// 文字起こしを日付×講習種別ごとに蓄積
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function logTranscript(text) {
  const day = todayStr();
  if (!transcriptLog[day]) transcriptLog[day] = {};
  if (!transcriptLog[day][selectedCategory]) transcriptLog[day][selectedCategory] = [];
  const d = new Date();
  const t = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
  transcriptLog[day][selectedCategory].push({ time: t, ja: text });
  // localStorageは容量制限があるので直近7日分だけ保持
  const days = Object.keys(transcriptLog).sort();
  while (days.length > 7) { delete transcriptLog[days.shift()]; }
  try { localStorage.setItem('teacher_tlog', JSON.stringify(transcriptLog)); } catch(e) {}
}

// 今日の文字起こしをダウンロード
function downloadTranscript() {
  const day = todayStr();
  const catName = (CATEGORIES.find(c=>c.id===selectedCategory)?.label || selectedCategory).replace(/[^\p{L}\p{N}]/gu,'');
  const entries = (transcriptLog[day] && transcriptLog[day][selectedCategory]) || [];
  if (!entries.length) { alert('本日・この講習の文字起こしがまだありません'); return; }
  const cat = CATEGORIES.find(c=>c.id===selectedCategory);
  let txt = `講習日: ${day}\n講習区分: ${cat?cat.label:selectedCategory}\n`;
  if (cat && cat.subs) txt += `対象講習（候補）: ${cat.subs.join(' / ')}\n`;
  txt += `件数: ${entries.length}\n`;
  txt += '='.repeat(40) + '\n\n';
  entries.forEach(e => { txt += `[${e.time}] ${e.ja}\n`; });
  const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${day}_${catName}.txt`;
  a.click();
}

// 辞書・用語集を読み込み（復元＋統合、重複整理）
function uploadSettings(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      // 辞書の統合（誤→正 完全一致は1つに、誤同じ・正違いは両方残す）
      if (data.catDict) {
        Object.keys(data.catDict).forEach(cat => {
          if (!catDict[cat]) catDict[cat] = [];
          data.catDict[cat].forEach(np => {
            const exists = catDict[cat].some(e => e.wrong===np.wrong && e.correct===np.correct);
            if (!exists) catDict[cat].push({ wrong: np.wrong, correct: np.correct });
          });
        });
      }
      // 用語集の統合（既存が空ならそのまま入れる、あれば結合して重複行を除く）
      if (data.catContext) {
        Object.keys(data.catContext).forEach(cat => {
          const incoming = (data.catContext[cat]||'').trim();
          if (!incoming) return;
          const cur = (catContext[cat]||'').trim();
          if (!cur) { catContext[cat] = incoming; }
          else {
            // 行単位で重複を除いて結合
            const set = new Set(cur.split('\n').map(s=>s.trim()).filter(Boolean));
            incoming.split('\n').map(s=>s.trim()).filter(Boolean).forEach(l=>set.add(l));
            catContext[cat] = [...set].join('\n');
          }
        });
      }
      // 対訳表の統合（同じ日本語は上書き、新規は追加）
      if (data.catTaiyaku) {
        Object.keys(data.catTaiyaku).forEach(cat => {
          if (!catTaiyaku[cat]) catTaiyaku[cat] = [];
          data.catTaiyaku[cat].forEach(np => {
            const idx = catTaiyaku[cat].findIndex(e => e.ja === np.ja);
            if (idx >= 0) catTaiyaku[cat][idx] = np;
            else catTaiyaku[cat].push(np);
          });
        });
      }
      // 言語リスト（既存になければ追加）
      if (data.langList && data.langList.length) {
        data.langList.forEach(nl => {
          if (!LANGUAGES.some(l=>l.code===nl.code || l.name===nl.name)) LANGUAGES.push(nl);
        });
        localStorage.setItem('teacher_langlist', JSON.stringify(LANGUAGES));
        renderLangChips();
      }
      renderDict(); renderCtx();
      saveServer();
      const m = document.getElementById('dataMsg'); m.textContent='✓ 読み込み・統合しました'; setTimeout(()=>{m.textContent='';},3000);
    } catch(err) {
      alert('ファイルの読み込みに失敗しました（形式が違う可能性があります）');
    }
  };
  r.readAsText(f, 'UTF-8');
  ev.target.value = '';
}

  if (!apiKey && !useServerKey) { alert('APIキーが設定されていません'); return; }

  // 未訳セルがある用語を集める
  const targets = rows.filter(r => LANGUAGES.some(l => !r[l.code]));
  if (!targets.length) { alert('未訳の用語はありません'); return; }
  const msg = document.getElementById('taiyakuMsg');
  const langList = LANGUAGES.map(l => `"${l.code}"(${l.name})`).join(', ');
  // 10語ずつ処理
  const BATCH = 10;
  let done = 0;
  for (let i = 0; i < targets.length; i += BATCH) {
    const batch = targets.slice(i, i+BATCH);
    msg.textContent = `翻訳中... ${done}/${targets.length}語`;
    const words = batch.map(r => r.ja).join('、');
    const prompt = `建設業「${CATEGORIES.find(c=>c.id===selectedCategory)?.label||''}」の専門用語を翻訳します。次の日本語の用語それぞれを、以下の言語に訳してください。
言語キー: ${langList}

用語: ${words}

各用語について、専門用語として正確な訳を返してください。JSON配列のみ出力:
[{"ja":"用語","zh":"...","en":"...",...（全言語キー）}]
説明不要。JSONのみ。`;
    try {
      const res = await fetch(apiUrl('/api'), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ api_key:(useServerKey?'':apiKey), passphrase, model: MODEL_IDS.sonnet, max_tokens: 2500, messages:[{role:'user',content:prompt}] })
      });
      const data = await res.json();
      let out = '';
      if (data.content && data.content.length) out = data.content.map(b=>b.text||'').join('');
      const m = out.match(/\[[\s\S]*\]/);
      if (m) {
        const arr = JSON.parse(m[0]);
        arr.forEach(item => {
          const row = rows.find(r => r.ja === item.ja);
          if (row) LANGUAGES.forEach(l => { if (!row[l.code] && item[l.code]) { row[l.code] = item[l.code]; delete row['back_'+l.code]; } });
        });
        renderTaiyaku();
      }
    } catch(e) { console.log('AI翻訳エラー:', e); }
    done += batch.length;
  }
  msg.textContent = `✓ 完了（${targets.length}語）`;
  saveServer();
  setTimeout(()=>{ msg.textContent=''; }, 3000);
}

// 確認用エクセル出力：各言語を日本語へ逆翻訳（日本語→その言語→日本語）して確認列を作る。
// 逆翻訳はキャッシュ（back_<code>）し、用語を変えた（訳を入れ直した）ときだけ作り直す。
async function exportTaiyakuExcel() {
  if (typeof XLSX === 'undefined') { alert('エクセル部品の読み込み中です。少し待って再度押してください。'); return; }
  const rows = currentTaiyaku();
  if (!rows.length) { alert('この講習の対訳表が空です。先に用語を追加・翻訳してください。'); return; }
  const langs = LANGUAGES;
  const catName = (CATEGORIES.find(c=>c.id===selectedCategory)?.label || selectedCategory).replace(/[^\p{L}\p{N}]/gu,'');
  const msg = document.getElementById('taiyakuMsg');

  // 逆翻訳が要るセル（訳はあるが back_ が無い）を集める
  const need = [];
  rows.forEach(r => langs.forEach(l => {
    if (r[l.code] && !r['back_'+l.code]) need.push({ r, code: l.code, name: l.name, val: r[l.code] });
  }));

  if (need.length && !apiKey && !useServerKey) { alert('APIキーが設定されていません（逆翻訳に必要です）'); return; }

  // 8件ずつ逆翻訳
  const BATCH = 8;
  let done = 0;
  for (let i = 0; i < need.length; i += BATCH) {
    const batch = need.slice(i, i+BATCH);
    msg.textContent = `逆翻訳中... ${done}/${need.length}`;
    const items = batch.map((b, j) => `${j}: [${b.name}] ${b.val}`).join('\n');
    const prompt = `次の各行は、ある言語の単語・用語です。それぞれを日本語に訳してください（逆翻訳の確認用）。
${items}

各行の番号をキーに、日本語訳のみをJSONで返してください。説明不要、JSONのみ:
{"0":"日本語訳","1":"日本語訳",...}`;
    try {
      const res = await fetch(apiUrl('/api'), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ api_key:(useServerKey?'':apiKey), passphrase, model: MODEL_IDS.sonnet, max_tokens: 2000, messages:[{role:'user',content:prompt}] })
      });
      const data = await res.json();
      let out = '';
      if (data.content && data.content.length) out = data.content.map(b=>b.text||'').join('');
      const m = out.match(/\{[\s\S]*\}/);
      if (m) {
        const obj = JSON.parse(m[0]);
        batch.forEach((b, j) => { if (obj[j] != null) b.r['back_'+b.code] = String(obj[j]); });
      }
    } catch(e) { console.log('逆翻訳エラー:', e); }
    done += batch.length;
  }
  if (need.length) { saveServer(); }
  msg.textContent = 'エクセル作成中...';

  // ヘッダ：No / 日本語 / フリガナ / 各言語 / 各言語→日本語（確認）
  const header = ['No', '日本語', 'フリガナ'];
  langs.forEach(l => header.push(`${l.name}`));
  langs.forEach(l => header.push(`${l.name}→日本語（確認）`));
  const aoa = [header];
  rows.forEach((r, i) => {
    const line = [i+1, r.ja, r.furi || ''];
    langs.forEach(l => line.push(r[l.code] || ''));
    langs.forEach(l => line.push(r['back_'+l.code] || ''));
    aoa.push(line);
  });

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  // 列幅：日本語・確認列を広めに
  const cols = [{wch:4},{wch:16},{wch:14}];
  langs.forEach(()=>cols.push({wch:16}));
  langs.forEach(()=>cols.push({wch:18}));
  ws['!cols'] = cols;
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '対訳表');
  XLSX.writeFile(wb, `対訳表_${catName}_${todayStr()}.xlsx`);
  msg.textContent = `✓ エクセル出力（${rows.length}語）`;
  setTimeout(()=>{ msg.textContent=''; }, 3000);
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function ensurePassphrase() {
  // 合言葉が必要かサーバーに確認。必要なら入力を促す
  async function tryConfig() {
    try {
      const res = await fetch(apiUrl(`/config?passphrase=${encodeURIComponent(passphrase)}`));
      if (res.status === 401) return 'need';
      if (res.ok) { serverConfig = await res.json(); if (serverConfig.anthropic) useServerKey = true; return 'ok'; }
      return 'ok';
    } catch(e) { return 'ok'; }
  }
  let st = await tryConfig();
  while (st === 'need') {
    const input = prompt('合言葉を入力してください：');
    if (input === null) return false;
    passphrase = input.trim();
    st = await tryConfig();
    if (st === 'ok') localStorage.setItem('app_passphrase', passphrase);
    else if (st === 'need') alert('合言葉が違います。もう一度入力してください。');
  }
  return true;
}

async function init() {
  const ok = await ensurePassphrase();
  if (!ok) { document.body.innerHTML = '<div style="color:#eee;padding:40px;text-align:center;font-size:18px;">合言葉が必要です。再読み込みして入力してください。</div>'; return; }
  if (apiKey) document.getElementById('apiKeyInput').value = apiKey;
  document.getElementById('delaySlider').value = autoDelay;
  document.getElementById('delayLabel').textContent = autoDelay.toFixed(1) + '秒';
  switchModel(model);
  setSize(textSize);
  renderCats();
  renderLangChips();
  renderDict();
  renderCtx();
  loadServer();
  connectWS();
  document.getElementById('jaInput').focus();
}
init();
