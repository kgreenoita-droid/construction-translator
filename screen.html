<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>受講者用モニター - 多言語通訳システム</title>
<style>
  :root {
    --bg: #000; --bg2: #0d0d0d; --bg3: #111;
    --border: #222; --text: #fff; --text2: #888;
    --accent: #f0a500; --success: #3fb950;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: 'Noto Sans JP','Noto Sans',sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; overflow: hidden; }

  header { background: #080808; border-bottom: 2px solid var(--accent); padding: 6px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  header h1 { font-size: 14px; font-weight: 700; color: var(--accent); }
  .ws-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); }
  .ws-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text2); }
  .ws-dot.connected { background: var(--success); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .settings-toggle-btn { background: #1a1a1a; border: 1px solid #333; color: #888; border-radius: 6px; padding: 4px 8px; font-size: 13px; cursor: pointer; margin-left: auto; }
  .settings-toggle-btn:hover { border-color: var(--accent); color: var(--accent); }
  .fs-btn { background: #1a1a1a; border: 1px solid #333; color: #888; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .fs-btn:hover { border-color: var(--accent); color: var(--accent); }

  #settingsPanel { display: none; background: #060606; border-bottom: 1px solid var(--border); }
  .bar { padding: 8px 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .bar-label { font-size: 11px; color: var(--text2); white-space: nowrap; }
  .api-input { background: #111; border: 1px solid #333; color: var(--text); border-radius: 6px; padding: 5px 10px; font-size: 12px; font-family: monospace; width: 200px; }
  .btn-mini { background: #1a1a1a; border: 1px solid #333; color: #888; border-radius: 6px; padding: 5px 10px; font-size: 11px; cursor: pointer; font-family: inherit; }
  .btn-mini.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
  .lang-chip { display: flex; align-items: center; gap: 4px; background: #111; border: 1px solid #333; border-radius: 16px; padding: 3px 8px; cursor: pointer; user-select: none; font-size: 12px; color: #666; white-space: nowrap; }
  .lang-chip.selected { border-color: var(--accent); color: var(--accent); background: rgba(240,165,0,0.08); }
  .lang-chip input { display: none; }

  .content { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .content::-webkit-scrollbar { width: 8px; }
  .content::-webkit-scrollbar-track { background: #0a0a0a; }
  .content::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

  .card { background: var(--bg3); border: 1px solid var(--border); border-radius: 14px; padding: 18px 24px; flex-shrink: 0; }
  .card.latest { border-color: var(--accent); background: #0d0d0d; }
  .card-ja { font-size: 20px; font-weight: 700; color: #999; margin-bottom: 14px; line-height: 1.4; }
  .lang-row { display: flex; align-items: baseline; gap: 14px; margin-top: 12px; }
  .lang-flag { font-size: 28px; flex-shrink: 0; }
  .lang-name { font-size: 13px; color: #555; width: 110px; flex-shrink: 0; }
  .lang-text { font-size: 40px; font-weight: 700; color: #fff; line-height: 1.35; flex: 1; }
  .lang-text.loading { color: #444; font-size: 20px; font-style: italic; font-weight: 400; }

  body[data-size="s"] .lang-text { font-size: 28px; }
  body[data-size="m"] .lang-text { font-size: 40px; }
  body[data-size="l"] .lang-text { font-size: 52px; }
  body[data-size="xl"] .lang-text { font-size: 68px; }
  body[data-size="s"] .card-ja { font-size: 16px; }
  body[data-size="m"] .card-ja { font-size: 20px; }
  body[data-size="l"] .card-ja { font-size: 26px; }
  body[data-size="xl"] .card-ja { font-size: 32px; }
  .waiting { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text2); font-size: 20px; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>🏗️ 多言語通訳システム（受講者モニター）</h1>
  <div class="ws-status">
    <div class="ws-dot" id="wsDot"></div>
    <span id="wsText">講師PCに接続中...</span>
  </div>
  <button class="settings-toggle-btn" onclick="toggleSettings()" title="設定">⚙️</button>
  <button class="fs-btn" onclick="toggleFullscreen()">⛶ 全画面</button>
</header>

<div id="settingsPanel">
  <div class="bar">
    <span class="bar-label" id="keyStatus" style="color:#444">APIキー確認中...</span>
    <input type="password" class="api-input" id="apiKeyInput" placeholder="手動入力（任意）" style="display:none" />
    <button class="btn-mini" id="apiKeySaveBtn" onclick="saveApiKey()" style="display:none">保存</button>
  </div>
  <div class="bar">
    <span class="bar-label">このモニターの担当言語（最大3つ）：</span>
    <div id="langChips" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
  </div>
  <div class="bar">
    <span class="bar-label">文字サイズ：</span>
    <button class="btn-mini" onclick="setSize('s')" id="size-s">小</button>
    <button class="btn-mini" onclick="setSize('m')" id="size-m">中</button>
    <button class="btn-mini" onclick="setSize('l')" id="size-l">大</button>
    <button class="btn-mini" onclick="setSize('xl')" id="size-xl">特大</button>
  </div>
</div>

<div class="content" id="content">
  <div class="waiting" id="waiting">講師が話し始めると、ここに翻訳が大きく表示されます</div>
</div>

<script>
const DEFAULT_LANGUAGES = [
  { code:'zh', name:'中国語', native:'中文', flag:'🇨🇳' },
  { code:'en', name:'英語', native:'English', flag:'🇺🇸' },
  { code:'vi', name:'ベトナム語', native:'Tiếng Việt', flag:'🇻🇳' },
  { code:'tl', name:'タガログ語', native:'Filipino', flag:'🇵🇭' },
  { code:'id', name:'インドネシア語', native:'Bahasa', flag:'🇮🇩' },
  { code:'my', name:'ミャンマー語', native:'မြန်မာ', flag:'🇲🇲' },
  { code:'ne', name:'ネパール語', native:'नेपाली', flag:'🇳🇵' },
  { code:'si', name:'シンハラ語', native:'සිංහල', flag:'🇱🇰' },
  { code:'bn', name:'ベンガル語', native:'বাংলা', flag:'🇧🇩' },
  { code:'km', name:'クメール語', native:'ខ្មែរ', flag:'🇰🇭' },
];
let LANGUAGES = JSON.parse(localStorage.getItem('screen_langlist') || 'null') || DEFAULT_LANGUAGES.slice();
let LANG_MAP = Object.fromEntries(LANGUAGES.map(l => [l.code, l]));
const MODEL_ID = 'claude-haiku-4-5-20251001';

let ws = null;
let textSize = localStorage.getItem('screen_size') || 'm';
function setSize(s) {
  textSize = s;
  localStorage.setItem('screen_size', s);
  document.body.setAttribute('data-size', s);
  ['s','m','l','xl'].forEach(x => { const b=document.getElementById('size-'+x); if(b) b.className='btn-mini'+(x===s?' active':''); });
}
let passphrase = localStorage.getItem('app_passphrase') || '';
let apiKey = localStorage.getItem('screen_api_key') || '';
let useServerKey = false;
let selectedLangs = new Set(JSON.parse(localStorage.getItem('screen_langs') || '["tl","id","my"]'));
let history = [];
const MAX_HISTORY = 8;

function apiUrl(path){ return `${location.protocol}//${location.hostname}${location.port ? ':'+location.port : ''}${path}`; }

function toggleSettings(){ const p=document.getElementById('settingsPanel'); p.style.display=(p.style.display==='none'||!p.style.display)?'block':'none'; }
function toggleFullscreen(){ if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(()=>{});}else{document.exitFullscreen().catch(()=>{});} }

function saveApiKey(){ apiKey=document.getElementById('apiKeyInput').value.trim(); localStorage.setItem('screen_api_key',apiKey); const b=event.target; b.textContent='✓'; setTimeout(()=>{b.textContent='保存';},1500); updateKeyStatus(); }
function updateKeyStatus(){
  const el=document.getElementById('keyStatus'), inp=document.getElementById('apiKeyInput'), btn=document.getElementById('apiKeySaveBtn');
  if(useServerKey){ el.textContent='✅ APIキー：サーバー設定済み'; el.style.color='#3fb950'; inp.style.display='none'; btn.style.display='none'; }
  else if(apiKey){ el.textContent='✅ APIキー：このPCに保存済み'; el.style.color='#3fb950'; inp.style.display='inline-block'; btn.style.display='inline-block'; }
  else { el.textContent='⚠️ APIキー未設定'; el.style.color='#f0a500'; inp.style.display='inline-block'; btn.style.display='inline-block'; }
}

async function checkConfig(){
  try{ const res=await fetch(apiUrl(`/config?passphrase=${encodeURIComponent(passphrase)}`)); if(res.ok){ const c=await res.json(); if(c.anthropic) useServerKey=true; } }catch(e){}
  updateKeyStatus();
  // 講師が編集した言語リストをサーバーから取得
  try{ const res=await fetch(apiUrl('/settings')); if(res.ok){ const d=await res.json(); if(d.langList && d.langList.length){ LANGUAGES=d.langList; LANG_MAP=Object.fromEntries(LANGUAGES.map(l=>[l.code,l])); localStorage.setItem('screen_langlist',JSON.stringify(LANGUAGES)); renderLangChips(); } } }catch(e){}
}

function renderLangChips(){
  const c=document.getElementById('langChips');
  c.innerHTML=LANGUAGES.map(l=>{ const sel=selectedLangs.has(l.code); return `<label class="lang-chip ${sel?'selected':''}"><input type="checkbox" value="${l.code}" ${sel?'checked':''}>${l.flag} ${l.name}</label>`; }).join('');
  c.querySelectorAll('input').forEach(cb=>cb.addEventListener('change',()=>toggleLang(cb.value,cb.checked)));
}
function toggleLang(code,checked){
  if(checked){ if(selectedLangs.size>=3){ const first=[...selectedLangs][0]; selectedLangs.delete(first);} selectedLangs.add(code);} else selectedLangs.delete(code);
  localStorage.setItem('screen_langs',JSON.stringify([...selectedLangs]));
  renderLangChips();
  // 既存履歴を新しい言語構成で翻訳し直す
  history.forEach(item=>{ item.translations={}; translateItem(item); });
  render();
}

function connectWS(){
  const proto=location.protocol==='https:'?'wss:':'ws:'; const port=location.port?':'+location.port:'';
  ws=new WebSocket(`${proto}//${location.hostname}${port}/ws`);
  ws.onopen=()=>{ document.getElementById('wsDot').className='ws-dot connected'; document.getElementById('wsText').textContent='講師PCと接続済み'; };
  ws.onclose=()=>{ document.getElementById('wsDot').className='ws-dot'; document.getElementById('wsText').textContent='再接続中...'; setTimeout(connectWS,3000); };
  ws.onerror=()=>{};
  ws.onmessage=(e)=>{
    try{
      const data=JSON.parse(e.data);
      if(data.type!=='ja') return;
      if(data.action==='add'){
        const item={ id:data.id, ja:data.ja, translations:{}, loading:true };
        history.unshift(item);
        if(history.length>MAX_HISTORY) history.pop();
        render();
        translateItem(item);
      } else if(data.action==='edit'){
        let item=history.find(h=>h.id===data.id);
        if(item){ item.ja=data.ja; item.translations={}; item.loading=true; render(); translateItem(item); }
        else { const ni={id:data.id,ja:data.ja,translations:{},loading:true}; history.unshift(ni); render(); translateItem(ni); }
      } else if(data.action==='delete'){
        history=history.filter(h=>h.id!==data.id); render();
      }
    }catch(err){}
  };
}

// 受け取った日本語を、このページの担当言語に翻訳
async function translateItem(item){
  const langs=LANGUAGES.filter(l=>selectedLangs.has(l.code));
  if(!langs.length){ item.loading=false; render(); return; }
  if(!apiKey && !useServerKey){ item.loading=false; render(); return; }
  const langList=langs.map(l=>`- ${l.name}（${l.native}）: キー "${l.code}"`).join('\n');
  const prompt=`建設業技能講習の専門翻訳者として翻訳してください。

日本語:「${item.ja}」

以下の言語へ翻訳してJSONのみ返してください:
${langList}

{"zh":"...","en":"..."}のように選択言語のキーのみ含めてください。説明文は不要です。`;
  try{
    const res=await fetch(apiUrl('/api'),{ method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ api_key:(useServerKey?'':apiKey), passphrase:passphrase, model:MODEL_ID, max_tokens:900, stream:true, messages:[{role:'user',content:prompt}] }) });
    const reader=res.body.getReader(); const decoder=new TextDecoder(); let buf='', full='';
    while(true){ const {done,value}=await reader.read(); if(done)break; buf+=decoder.decode(value,{stream:true}); const lines=buf.split('\n'); buf=lines.pop();
      for(const line of lines){ if(!line.startsWith('data: '))continue; const d=line.slice(6).trim(); if(d==='[DONE]')continue;
        try{ const p=JSON.parse(d); if(p.type==='content_block_delta'&&p.delta?.text){ full+=p.delta.text; const m=full.match(/\{[\s\S]*\}/); if(m){ try{ item.translations=JSON.parse(m[0]); item.loading=false; render(); }catch(e){} } } }catch(e){}
      }
    }
    const m=full.match(/\{[\s\S]*\}/); if(m){ try{ item.translations=JSON.parse(m[0]); }catch(e){} }
    item.loading=false; render();
  }catch(err){ item.loading=false; render(); console.error('翻訳エラー:',err); }
}

function render(){
  const content=document.getElementById('content');
  if(!history.length){ content.innerHTML='<div class="waiting">講師が話し始めると、ここに翻訳が大きく表示されます</div>'; return; }
  const langs=LANGUAGES.filter(l=>selectedLangs.has(l.code));
  content.innerHTML=history.map((item,idx)=>{
    const rows=langs.map(lang=>{ const t=item.translations?item.translations[lang.code]:''; const cls=(item.loading&&!t)?'loading':''; const txt=t||(item.loading?'翻訳中...':'－');
      return `<div class="lang-row"><span class="lang-flag">${lang.flag}</span><span class="lang-name">${lang.name}</span><span class="lang-text ${cls}">${esc(txt)}</span></div>`; }).join('');
    return `<div class="card ${idx===0?'latest':''}"><div class="card-ja">${esc(item.ja)}</div>${rows}</div>`;
  }).join('');
  content.scrollTop=0;
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function ensurePassphrase(){
  async function tryConfig(){
    try{
      const res=await fetch(apiUrl(`/config?passphrase=${encodeURIComponent(passphrase)}`));
      if(res.status===401) return 'need';
      if(res.ok){ const c=await res.json(); if(c.anthropic) useServerKey=true; return 'ok'; }
      return 'ok';
    }catch(e){ return 'ok'; }
  }
  let st=await tryConfig();
  while(st==='need'){
    const input=prompt('合言葉を入力してください：');
    if(input===null) return false;
    passphrase=input.trim();
    st=await tryConfig();
    if(st==='ok') localStorage.setItem('app_passphrase',passphrase);
    else if(st==='need') alert('合言葉が違います。もう一度入力してください。');
  }
  return true;
}

async function init(){
  const ok=await ensurePassphrase();
  if(!ok){ document.body.innerHTML='<div style="color:#eee;padding:40px;text-align:center;font-size:18px;">合言葉が必要です。再読み込みして入力してください。</div>'; return; }
  if(apiKey) document.getElementById('apiKeyInput').value=apiKey;
  setSize(textSize);
  renderLangChips();
  checkConfig();
  connectWS();
}
init();
</script>
</body>
</html>
